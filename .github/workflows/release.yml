name: Release

# Builds installers for every supported platform and attaches them to the
# GitHub Release for the pushed tag. Push a tag like `v1.3.11` to trigger.
# `workflow_dispatch` lets you exercise the build matrix without releasing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native arch per runner — avoids cross-compiling the better-sqlite3
          # native addon, which electron-rebuild only builds for the host arch.
          # mac: zip only — DMG creation is flaky on headless CI runners.
          - { os: macos-14, platform: mac, arch: arm64, args: '--mac zip --arm64' }
          - { os: windows-latest, platform: win, arch: x64, args: '--win --x64' }
          - { os: ubuntu-latest, platform: linux, arch: x64, args: '--linux --x64' }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # deb packaging needs fakeroot/dpkg present on the runner
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg xvfb

      # postinstall rebuilds better-sqlite3 against Electron's ABI for this arch
      - run: npm ci

      - run: npm run build:app

      - name: Package (${{ matrix.platform }} ${{ matrix.arch }})
        # Signing is OPTIONAL. IMPORTANT: an empty-but-defined CSC_LINK makes
        # electron-builder treat "" as a certificate path and fail the mac
        # build with "⨯ <workspace> not a file" — so signing env vars are only
        # exported when the secrets actually exist. Populate them in repo
        # Settings → Secrets to get signed + notarized releases with no other
        # code change. See docs/BUILDING.md → "Code signing & notarization".
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            export CSC_LINK="${{ secrets.CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.CSC_KEY_PASSWORD }}"
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_APP_SPECIFIC_PASSWORD="${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          fi
          if [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
            export WIN_CSC_LINK="${{ secrets.WIN_CSC_LINK }}"
            export WIN_CSC_KEY_PASSWORD="${{ secrets.WIN_CSC_KEY_PASSWORD }}"
          elif [ "${{ matrix.platform }}" = "win" ]; then
            # Guarantee that an early beta still packages cleanly when the
            # runner has no matching certificate in its local certificate store.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          signing_args=()
          if [ "${{ matrix.platform }}" = "mac" ] && [ -z "${{ secrets.CSC_LINK }}" ]; then
            signing_args+=("-c.mac.identity=-")
          fi
          npx electron-builder ${{ matrix.args }} "${signing_args[@]}" --publish never
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test packaged app
        run: node scripts/smoke-packaged.mjs ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Collect installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Never advertise an all-platform release if one native build failed.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist-release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' \) \
            -exec cp -v {} dist-release/ \;
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          name: Codemaxxing ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: dist-release/*
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
          # Release notes are reviewed and versioned with the source instead
          # of being generated from commit titles.
          generate_release_notes: false
